apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  lab.json: |
    {
      "uid": "lab",
      "title": "SLOs and Burn Rate Alerts",
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "refresh": "5s",
      "timezone": "utc",
      "panels": [
        {
          "id": 1,
          "title": "Checkouts completed",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(customer_checkouts_total{result=\"ok\"}[30s])) / sum(rate(customer_checkouts_total[30s]))",
              "legendFormat": "completed",
              "refId": "A",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never"
              },
              "max": 1.02
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 2,
          "title": "Customer p99 latency",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(customer_checkout_duration_seconds_bucket[30s])))",
              "legendFormat": "p99",
              "refId": "A",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "vector(0.5)",
              "legendFormat": "500ms",
              "refId": "B",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 3,
          "title": "What customers saw",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (result) (rate(customer_checkouts_total[30s]))",
              "legendFormat": "{{result}}",
              "refId": "A",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 4,
          "title": "Error ratio by window",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "slo:error_ratio:rate2m",
              "legendFormat": "2m",
              "refId": "A",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "slo:error_ratio:rate30s",
              "legendFormat": "30s",
              "refId": "B",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "vector(0.0144)",
              "legendFormat": "page 1.44%",
              "refId": "C",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "vector(0.006)",
              "legendFormat": "ticket 0.6%",
              "refId": "D",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ]
    }
